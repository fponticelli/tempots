name: Publish Docs

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml
      - name: PNPM Install
        run: pnpm install
      - name: Build Dependencies
        run: pnpm run build --filter="@tempots/std" --filter="@tempots/dom"
      - name: Build Demos
        run: pnpm run build:demos
      - name: Assemble Docs
        run: pnpm run docs
      - name: Build Docs
        run: pnpm run build --filter=@tempos/docs
      - name: Verify generated docs
        run: pnpm --filter @tempos/docs test:ssg
      - name: Install Chromium for the docs browser tests
        run: pnpm --filter @tempos/docs exec playwright install --with-deps chromium
      - name: Test the HTML-to-Tempo editor
        run: pnpm --filter @tempos/docs test:browser
      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: 'apps/docs/dist'

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6.0.0
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
