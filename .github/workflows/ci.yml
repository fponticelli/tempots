name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install
        
      - name: Lint
        run: pnpm run lint
        
      - name: Type check
        run: pnpm run typecheck
        
      - name: Build packages
        run: pnpm run build
        
      - name: Install Chromium for the SSR browser tests
        run: pnpm --filter ssr-demo exec playwright install --with-deps chromium

      - name: Test server HTML and island interactivity
        run: pnpm --filter ssr-demo test:e2e

      - name: Run tests with coverage
        run: pnpm run test:coverage
        
      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: |
            packages/tempots-std/coverage/lcov.info
            packages/tempots-dom/coverage/lcov.info
            packages/tempots-ui/coverage/lcov.info
            packages/tempots-native/coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: true

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: romeovs/lcov-reporter-action@v0.4.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          lcov-file: |
            packages/tempots-std/coverage/lcov.info
            packages/tempots-dom/coverage/lcov.info
            packages/tempots-ui/coverage/lcov.info
            packages/tempots-native/coverage/lcov.info
          
      - name: Archive coverage artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage-reports
          path: |
            packages/*/coverage/
          retention-days: 30
